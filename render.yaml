services:
  - type: web
    name: rekxare-dami-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    buildContext: ./backend
    healthCheckPath: /health
    plan: free
    envVars:
      # Never commit real secrets.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://rekxare-dami.pages.dev
      - key: TRUST_PROXY
        value: "true"
      - key: ENVIRONMENT
        value: production
