services:
  - type: web
    name: rekxare-dami-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    buildContext: ./backend
    healthCheckPath: /health
    plan: free
    envVars:
      # Never commit real secrets.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://rekxare-dami.pages.dev
      - key: TRUST_PROXY
        value: "true"
      - key: ENVIRONMENT
        value: production

  # Free-tier web services sleep after 15 minutes without traffic, which gives
  # real users a 5-30s cold start. This cron pings /health every 10 minutes so
  # the API stays warm. Update KEEPALIVE_URL here if the backend's public URL
  # ever changes.
  - type: cron
    name: rekxare-dami-keep-alive
    runtime: python
    schedule: "*/10 * * * *"
    plan: free
    rootDir: keepalive
    startCommand: python main.py
    envVars:
      - key: KEEPALIVE_URL
        value: https://rekxare-dami-api.fastapicloud.dev/health
