name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck / tests / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.27.1 --activate
      - name: Install dependencies (with diagnostics)
        run: |
          set +e
          pnpm install --frozen-lockfile > /tmp/pnpm_err.txt 2>&1
          ec=$?
          echo "::error title=pnpm-install-exit-code::$ec"
          if [ $ec -ne 0 ]; then
            echo "::error title=pnpm-lines-total::$(wc -l < /tmp/pnpm_err.txt)"
            echo "::notice title=pnpm-workspace::$(cat pnpm-workspace.yaml | tr '\n' ';')"
            grep -inE 'err_pnpm|error|failed|fail|elifecycle|signal|denied|forbidden|untrusted|policy|approve|blocked|ignored' /tmp/pnpm_err.txt | tail -n 30 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error file=pnpm-out,line=1::${esc}"
            done
            echo "== TAIL ==" >&2
            tail -n 6 /tmp/pnpm_err.txt >&2
          fi
          exit $ec
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build